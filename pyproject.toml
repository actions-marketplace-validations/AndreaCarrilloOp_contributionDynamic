[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "contribution-dynamic"
version = "1.0.0"
description = "Animation and simulation engine for GitHub contributions"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/AndreaCarrilloOp/contributionDynamic"
Issues = "https://github.com/AndreaCarrilloOp/contributionDynamic/issues"

[project.scripts]
contribution-dynamic = "contribution_dynamic.cli:main"

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.6", "coverage==7.17.4"]
visual = ["playwright==1.65.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["contribution_dynamic"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
